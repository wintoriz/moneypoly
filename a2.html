<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edukinglish - Nivel A2 (Detectives)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Nunito', sans-serif; }
    h1, h2, h3, .font-heading { font-family: 'Fredoka', cursive; }
  </style>
</head>
<body class="bg-slate-900 min-h-screen text-slate-100 flex flex-col justify-between bg-gradient-to-br from-purple-950 via-slate-900 to-indigo-950">

  <!-- Encabezado -->
  <header class="w-full bg-purple-900/40 border-b border-purple-500/30 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="https://wintoriz.github.io/edukinglishmenu/" class="bg-purple-800/80 hover:bg-purple-700 text-purple-200 px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1 border border-purple-500/30">
          ← Menú Principal
        </a>
        <span class="text-xl">🐰</span>
        <h1 class="font-heading font-bold text-lg text-purple-300 hidden sm:block">
          Edukinglish <span class="text-white">· Nivel A2</span>
        </h1>
      </div>
      <div class="flex items-center gap-2">
        <span class="bg-purple-500/20 text-purple-300 border border-purple-400/30 text-xs font-extrabold px-3 py-1 rounded-full uppercase">
          Mooney's Detectives 🔍
        </span>
      </div>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="w-full max-w-4xl mx-auto px-4 py-8 flex-grow">
    <div id="view-container">
      <div class="text-center py-12">
        <span class="text-4xl animate-bounce block mb-3">🔍</span>
        <h3 class="text-xl font-bold text-purple-300">Cargando Misiones de Mooney...</h3>
        <p class="text-slate-400 text-sm mt-2">Conectando con la base de datos de Edukinglish A2</p>
      </div>
    </div>
  </main>

  <!-- Pie de Página -->
  <footer class="w-full text-center py-4 border-t border-purple-900/50 text-slate-400 text-xs bg-slate-950/50">
    <p>© 2026 Edukinglish · Nivel A2 Detectives · Vive aprendiendo 🐰</p>
  </footer>

  <script>
    const SHEET_ID = "1TpVGs9piS8ci_WnbiclniODiTR8VnjZtK7sRN7qXe_g";
    const EXERCISES_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Nivel%20A2`;

    let allExercises = [];
    let currentModule = 1;
    let currentDay = 1;
    let currentIndex = 0;
    let unscrambleBuilt = []; // Almacena el orden creado por el usuario en 'Sentence Unscramble'

    let unlockedModule = parseInt(localStorage.getItem('a2_unlocked_module')) || 1;
    let unlockedDay = parseInt(localStorage.getItem('a2_unlocked_day')) || 1;

    function parseCSV(text) {
      const lines = text.split('\n');
      const result = [];
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;
        const row = [];
        let insideQuotes = false;
        let entry = '';
        for (let j = 0; j < line.length; j++) {
          const char = line[j];
          if (char === '"' && line[j+1] === '"') {
            entry += '"'; j++;
          } else if (char === '"') {
            insideQuotes = !insideQuotes;
          } else if (char === ',' && !insideQuotes) {
            row.push(entry.trim()); entry = '';
          } else {
            entry += char;
          }
        }
        row.push(entry.trim());
        result.push(row);
      }
      return result;
    }

    async function loadExercises() {
      try {
        const response = await fetch(EXERCISES_URL);
        if (!response.ok) throw new Error("Error en la descarga de datos");
        const csvText = await response.text();
        const rows = parseCSV(csvText);

        allExercises = rows
          .filter(row => row.length > 5 && row[0] === 'A2' && row[5] && row[5] !== 'Instrucción / Pregunta')
          .map(row => {
            const modNum = parseInt((row[1] || '').replace('Módulo', '').trim()) || 1;
            const dayNum = parseInt(row[2]) || 1;
            return {
              nivel: row[0] || '',
              moduloStr: row[1] || '',
              moduloNum: modNum,
              diaNum: dayNum,
              ejercicioNum: row[3] || '',
              tipo: row[4] || '',
              pregunta: row[5] || '',
              opciones: row[6] ? row[6].split('|').map(s => s.trim()) : [],
              respuesta: row[7] ? row[7].trim() : '',
              feedback: row[8] || ''
            };
          });

        if (allExercises.length > 0) {
          renderModuleSelection();
        } else {
          document.getElementById('view-container').innerHTML = `<div class="text-center py-8 text-amber-400"><p class="font-bold">No se encontraron preguntas válidas.</p></div>`;
        }
      } catch (error) {
        console.error("Error al cargar ejercicios:", error);
        document.getElementById('view-container').innerHTML = `<div class="text-center py-8 text-rose-400"><p class="font-bold text-lg">Error al conectar con Google Sheets.</p></div>`;
      }
    }

    function playEnglishSentence(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const match = text.match(/["'“]([^"'”]+)["'”]/);
        let sentenceToRead = match ? match[1] : text;
        sentenceToRead = sentenceToRead.replace(/_+/g, '... ');

        const utterance = new SpeechSynthesisUtterance(sentenceToRead);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      }
    }

    function renderModuleSelection() {
      const container = document.getElementById('view-container');
      let modulesHTML = '';

      for (let m = 1; m <= 10; m++) {
        const isUnlocked = m <= unlockedModule;
        modulesHTML += `
          <div onclick="${isUnlocked ? `selectModule(${m})` : ''}" 
               class="p-5 rounded-3xl border ${isUnlocked ? 'bg-slate-800/80 hover:bg-purple-900/40 border-purple-500/40 cursor-pointer shadow-lg transform hover:-translate-y-1 transition' : 'bg-slate-900/50 border-slate-800 opacity-50 cursor-not-allowed'} flex items-center justify-between">
            <div class="flex items-center gap-4">
              <div class="w-12 h-12 rounded-2xl ${isUnlocked ? 'bg-purple-500/20 text-purple-300 border border-purple-400/40' : 'bg-slate-800 text-slate-500'} flex items-center justify-center font-bold text-lg font-heading">
                ${m}
              </div>
              <div>
                <h4 class="font-bold text-white font-heading text-lg">Módulo ${m}</h4>
                <p class="text-xs text-slate-400">${isUnlocked ? '3 Días · 15 Misiones' : 'Bloqueado 🔒'}</p>
              </div>
            </div>
            <span class="text-xl">${isUnlocked ? '➡️' : '🔒'}</span>
          </div>
        `;
      }

      container.innerHTML = `
        <div class="bg-gradient-to-r from-purple-900/60 to-indigo-900/60 border border-purple-500/40 rounded-3xl p-6 mb-8 text-center shadow-xl">
          <div class="w-20 h-20 bg-purple-500/20 border-2 border-purple-400 rounded-2xl mx-auto mb-3 flex items-center justify-center text-4xl shadow-inner">
            🐰
          </div>
          <h2 class="text-3xl font-bold text-white font-heading">Misiones de Mooney (A2)</h2>
          <p class="text-purple-200 text-sm mt-1 max-w-lg mx-auto">Selecciona tu módulo actual para continuar tu aprendizaje.</p>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          ${modulesHTML}
        </div>
      `;
    }

    function selectModule(m) {
      currentModule = m;
      renderDaySelection();
    }

    function renderDaySelection() {
      const container = document.getElementById('view-container');
      let daysHTML = '';

      for (let d = 1; d <= 3; d++) {
        const isUnlocked = (currentModule < unlockedModule) || (currentModule === unlockedModule && d <= unlockedDay);
        daysHTML += `
          <div onclick="${isUnlocked ? `selectDay(${d})` : ''}" 
               class="p-6 rounded-3xl border ${isUnlocked ? 'bg-slate-800/80 hover:bg-purple-900/40 border-purple-500/40 cursor-pointer shadow-lg transform hover:-translate-y-1 transition' : 'bg-slate-900/50 border-slate-800 opacity-50 cursor-not-allowed'} flex flex-col items-center text-center">
            <span class="text-3xl mb-2">${isUnlocked ? '⭐' : '🔒'}</span>
            <h4 class="font-bold text-white font-heading text-xl mb-1">Día ${d}</h4>
            <p class="text-xs text-slate-400 mb-4">5 Ejercicios prácticos</p>
            <button ${isUnlocked ? '' : 'disabled'} class="w-full ${isUnlocked ? 'bg-purple-600 hover:bg-purple-500 text-white' : 'bg-slate-800 text-slate-500'} font-extrabold py-2.5 rounded-xl text-xs transition">
              ${isUnlocked ? 'Iniciar Misión' : 'Bloqueado'}
            </button>
          </div>
        `;
      }

      container.innerHTML = `
        <div class="flex items-center justify-between mb-6">
          <button onclick="renderModuleSelection()" class="text-xs text-purple-300 font-bold hover:text-white flex items-center gap-1">
            ← Cambiar de Módulo
          </button>
          <span class="text-xs bg-purple-500/20 text-purple-300 font-bold px-3 py-1 rounded-full uppercase">Módulo ${currentModule}</span>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          ${daysHTML}
        </div>
      `;
    }

    function selectDay(d) {
      currentDay = d;
      currentIndex = 0;
      renderExerciseScreen();
    }

    function renderExerciseScreen() {
      const exercises = allExercises.filter(ex => ex.moduloNum === currentModule && ex.diaNum === currentDay);
      const container = document.getElementById('view-container');

      if (!exercises || exercises.length === 0) {
        container.innerHTML = `
          <div class="bg-slate-800 border border-purple-500/30 rounded-3xl p-8 text-center">
            <p class="text-amber-400 font-bold mb-4">No hay ejercicios cargados para este día aún.</p>
            <button onclick="renderDaySelection()" class="bg-purple-600 text-white font-bold px-4 py-2 rounded-xl text-xs">Volver a los Días</button>
          </div>
        `;
        return;
      }

      const ex = exercises[currentIndex];
      const progressPercent = Math.round(((currentIndex + 1) / exercises.length) * 100);
      const isUnscramble = ex.tipo.toLowerCase().includes('unscramble');
      const isListening = ex.tipo.toLowerCase().includes('listening');

      // Botón de Audio SOLO en ejercicios de tipo Listening
      const cleanPregunta = ex.pregunta.replace(/'/g, "\\'").replace(/"/g, '&quot;');
      const audioButtonHTML = isListening ? `
        <div class="mb-6">
          <button onclick="playEnglishSentence('${cleanPregunta}')" 
                  class="bg-purple-600 hover:bg-purple-500 text-white font-extrabold py-3 px-6 rounded-2xl transition flex items-center gap-3 shadow-lg transform active:scale-95 border border-purple-400/40">
            <span class="text-2xl animate-pulse">🔊</span> Escuchar Oración en Inglés
          </button>
        </div>
      ` : '';

      let contentHTML = '';

      if (isUnscramble) {
        unscrambleBuilt = [];
        contentHTML = `
          <div class="bg-slate-900/60 border border-purple-500/30 rounded-2xl p-4 min-h-[64px] mb-4 flex flex-wrap gap-2 items-center" id="unscramble-target">
            <span class="text-slate-500 text-sm italic">Toca las palabras abajo para construir la oración...</span>
          </div>

          <div class="flex flex-wrap gap-2 mb-6" id="unscramble-source">
            ${ex.opciones.map((opt, i) => `
              <button id="word-btn-${i}" onclick="pickWord('${opt.replace(/'/g, "\\'").replace(/"/g, '&quot;')}', ${i})" 
                      class="bg-slate-700 hover:bg-purple-600/80 border border-purple-400/30 text-white font-bold py-2.5 px-4 rounded-xl shadow transition transform active:scale-95">
                ${opt}
              </button>
            `).join('')}
          </div>

          <div class="flex gap-3 mb-6">
            <button onclick="checkUnscramble('${ex.respuesta.replace(/'/g, "\\'").replace(/"/g, '&quot;')}', '${ex.feedback.replace(/'/g, "\\'").replace(/"/g, '&quot;')}')" 
                    class="bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold px-6 py-2.5 rounded-xl shadow-lg transition transform active:scale-95">
              Comprobar Orden
            </button>
            <button onclick="resetUnscramble()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold px-4 py-2.5 rounded-xl transition">
              Reiniciar
            </button>
          </div>
        `;
      } else {
        // Ejercicios normales de opción múltiple / selección
        contentHTML = `
          <div class="space-y-3 mb-6">
            ${ex.opciones.map(opt => {
              const cleanOpt = opt.replace(/'/g, "\\'").replace(/"/g, '&quot;');
              const cleanAns = ex.respuesta.replace(/'/g, "\\'").replace(/"/g, '&quot;');
              const cleanFb = ex.feedback.replace(/'/g, "\\'").replace(/"/g, '&quot;');
              return `
                <button onclick="checkAnswer('${cleanOpt}', '${cleanAns}', '${cleanFb}')" 
                        class="w-full bg-slate-700/80 hover:bg-purple-600/60 border border-purple-500/30 text-white font-semibold py-3.5 px-4 rounded-2xl text-left transition transform active:scale-95 shadow">
                  ${opt}
                </button>
              `;
            }).join('')}
          </div>
        `;
      }

      container.innerHTML = `
        <div class="bg-slate-800/80 border border-purple-500/30 rounded-3xl p-6 md:p-8 shadow-2xl backdrop-blur-md">
          
          <div class="flex items-center justify-between mb-3 border-b border-purple-500/20 pb-3">
            <button onclick="renderDaySelection()" class="text-xs text-purple-300 font-bold hover:text-white">
              ← Salir al menú
            </button>
            <div class="flex items-center gap-2">
              <span class="text-xs font-bold text-purple-400 uppercase tracking-widest">Módulo ${currentModule} · Día ${currentDay}</span>
              <span class="text-xs bg-purple-500/20 text-purple-300 font-bold px-2.5 py-1 rounded-lg">Ejercicio ${currentIndex + 1} de ${exercises.length}</span>
            </div>
          </div>

          <div class="w-full bg-slate-900/60 h-2.5 rounded-full overflow-hidden mb-6 border border-purple-500/20">
            <div class="bg-gradient-to-r from-purple-500 to-indigo-400 h-full transition-all duration-300" style="width: ${progressPercent}%"></div>
          </div>
          
          <h3 class="text-lg md:text-xl font-bold text-white mb-4 leading-relaxed">${ex.pregunta}</h3>

          ${audioButtonHTML}

          ${contentHTML}

          <div id="feedback-box" class="hidden p-4 rounded-2xl mb-4 text-sm font-semibold"></div>

          <div class="flex justify-between items-center pt-4 border-t border-purple-500/20">
            <button onclick="prevExercise()" ${currentIndex === 0 ? 'disabled class="opacity-40 cursor-not-allowed text-slate-500 text-sm font-bold"' : 'class="text-purple-300 hover:text-white text-sm font-bold"'}>
              ← Anterior
            </button>
            <button onclick="nextExercise(${exercises.length})" class="bg-purple-600 hover:bg-purple-500 text-white px-6 py-2.5 rounded-xl text-sm font-extrabold shadow-lg transition">
              ${currentIndex === exercises.length - 1 ? 'Completar Día 🎉' : 'Siguiente →'}
            </button>
          </div>
        </div>
      `;
    }

    // Funciones para armar la oración interactiva
    function pickWord(word, btnIndex) {
      const btn = document.getElementById(`word-btn-${btnIndex}`);
      if (btn) btn.disabled = true; btn.classList.add('opacity-30', 'pointer-events-none');
      
      unscrambleBuilt.push({ word, btnIndex });
      renderUnscrambleTarget();
    }

    function removeWord(builtIndex) {
      const item = unscrambleBuilt[builtIndex];
      const btn = document.getElementById(`word-btn-${item.btnIndex}`);
      if (btn) {
        btn.disabled = false;
        btn.classList.remove('opacity-30', 'pointer-events-none');
      }
      unscrambleBuilt.splice(builtIndex, 1);
      renderUnscrambleTarget();
    }

    function resetUnscramble() {
      unscrambleBuilt.forEach(item => {
        const btn = document.getElementById(`word-btn-${item.btnIndex}`);
        if (btn) {
          btn.disabled = false;
          btn.classList.remove('opacity-30', 'pointer-events-none');
        }
      });
      unscrambleBuilt = [];
      renderUnscrambleTarget();
    }

    function renderUnscrambleTarget() {
      const target = document.getElementById('unscramble-target');
      if (unscrambleBuilt.length === 0) {
        target.innerHTML = `<span class="text-slate-500 text-sm italic">Toca las palabras abajo para construir la oración...</span>`;
      } else {
        target.innerHTML = unscrambleBuilt.map((item, idx) => `
          <button onclick="removeWord(${idx})" class="bg-purple-600 hover:bg-purple-700 text-white font-extrabold px-3 py-1.5 rounded-xl text-sm transition">
            ${item.word} ✕
          </button>
        `).join('');
      }
    }

    function checkUnscramble(correct, feedback) {
      const userString = unscrambleBuilt.map(i => i.word).join(' ').trim();
      const cleanCorrect = correct.replace(/[.,/#!$%^&*;:{}=\-_`~()]/g, "").toLowerCase();
      const cleanUser = userString.replace(/[.,/#!$%^&*;:{}=\-_`~()]/g, "").toLowerCase();

      checkAnswer(cleanUser, cleanCorrect, feedback);
    }

    function checkAnswer(selected, correct, feedback) {
      const fbBox = document.getElementById('feedback-box');
      fbBox.classList.remove('hidden', 'bg-emerald-500/20', 'text-emerald-300', 'border-emerald-500/40', 'bg-rose-500/20', 'text-rose-300', 'border-rose-500/40');
      
      const isCorrect = selected.toLowerCase() === correct.toLowerCase();

      if (isCorrect) {
        fbBox.classList.add('bg-emerald-500/20', 'text-emerald-300', 'border', 'border-emerald-500/40');
        fbBox.innerHTML = `🥳 <strong>¡Excelente!</strong> ${feedback || 'Respuesta correcta.'}`;
      } else {
        fbBox.classList.add('bg-rose-500/20', 'text-rose-300', 'border', 'border-rose-500/40');
        fbBox.innerHTML = `❌ <strong>Respuesta incorrecta.</strong> <br/><span class="text-xs font-normal mt-1 block">${feedback || `La respuesta correcta era: "${correct}".`}</span>`;
      }
    }

    function nextExercise(totalInDay) {
      window.speechSynthesis.cancel();
      if (currentIndex < totalInDay - 1) {
        currentIndex++;
        renderExerciseScreen();
      } else {
        if (currentDay < 3) {
          if (currentModule === unlockedModule && currentDay === unlockedDay) {
            unlockedDay++;
            localStorage.setItem('a2_unlocked_day', unlockedDay);
          }
        } else {
          if (currentModule === unlockedModule) {
            unlockedModule++;
            unlockedDay = 1;
            localStorage.setItem('a2_unlocked_module', unlockedModule);
            localStorage.setItem('a2_unlocked_day', unlockedDay);
          }
        }
        renderDaySelection();
      }
    }

    function prevExercise() {
      window.speechSynthesis.cancel();
      if (currentIndex > 0) {
        currentIndex--;
        renderExerciseScreen();
      }
    }

    loadExercises();
  </script>

</body>
</html>
